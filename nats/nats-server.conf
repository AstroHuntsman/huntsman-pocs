# Basic server configuration
port: 4222
http_port: 8222

# JetStream configuration
jetstream {
  store_dir: "/data/jetstream"
  max_mem: 10G          # Increase memory limit (adjust based on your server's available RAM)
  max_file: 200G         # Increase disk storage limit
}

# Increase payload size for large messages
max_payload: 83886080   # 80MB
max_pending: 536870912  # 512MB 