version: '3.7'
services:
  python_tests:
    container_name: python_tests
    image: ${DOCKER_USER}/huntsman-pocs:${DOCKER_TAG}
    # build:
    #   context: ../
    #   dockerfile: tests/Dockerfile
    #   args:
    #     - pip_install_extras=[testing]
    stdin_open: true
    init: true
    tty: true
    env_file:
      - ./huntsman.test.env
      # - PANDIR=/huntsman
      # - HUNTSMAN_POCS=/huntsman
    volumes:
      - "./logs:/huntsman/logs"
      - "./build:/huntsman/build"
      - "./src:/huntsman/src"
      - "./tests:/huntsman/tests"
      - "./testing.yaml:/huntsman/tests/testing.yaml" # Required for config server setup
    command: [ "pytest", "-v", "-s" ]
