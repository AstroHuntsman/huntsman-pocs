services:
  python_tests:
    image: ${DOCKER_USER}/huntsman-pocs-test:${DOCKER_TAG}
    build:
      context: ${HUNTSMAN_POCS}
      dockerfile: ${HUNTSMAN_POCS}/docker/huntsman-pocs/Dockerfile
      args:
        - image_url=${DOCKER_USER}/panoptes-pocs
        - image_tag=v0.7.8
        - pip_install_extras=[testing]
    stdin_open: true
    init: true
    tty: true
    env_file:
      - ${HUNTSMAN_POCS}/tests/huntsman.test.env
    user: root # Need to use root user - appaerntly an issue with mamba. https://github.com/mamba-org/micromamba-docker/issues/407#issuecomment-2088523507
    volumes:
      - ${HUNTSMAN_POCS}/src:/huntsman/src
      - ${HUNTSMAN_POCS}/tests:/huntsman/tests
      - ${HUNTSMAN_POCS}/logs:/huntsman/logs
      - ${HUNTSMAN_POCS}/build:/huntsman/build
      - /var/run/docker.sock:/var/run/docker.sock
    command: -v -s tests
    entrypoint: pytest
